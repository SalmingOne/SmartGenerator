[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "load-orchestrator"
version = "0.1.0"
description = "Intelligent adaptive load testing orchestrator"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "textual>=0.80.0",
    "textual-plotext>=0.2.0",
]

[project.optional-dependencies]
[project.scripts]
load-orchestrator = "load_orchestrator.cli:main"
load-orchestrator-tui = "load_orchestrator.tui.app:run"