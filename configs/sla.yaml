adapter:
  host: 0.0.0.0
  port: 8089
  test_file: ./tests/load_tests/locustfile_httpbin.py
  type: locust
orchestrator:
  max_users: 100000
  monitoring_interval: 5
  spawn_rate: 10000
strategy:
  initial_users: 1
  max_error_rate: 10.0
  max_p99: 1500.0
  step_multiplier: 10.0
  type: sla_validation
